<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider-Hero Camera</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- MediaPipe Vision Tasks -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="assets/spider_emblem.jpg" alt="Spider Emblem" class="splash-logo">
        <div class="splash-text">INITIALIZING...</div>
    </div>

    <!-- Main Camera UI -->
    <div id="app-container">
        <!-- Hidden video element for camera feed -->
        <video id="webcam" autoplay playsinline></video>
        
        <!-- Canvas for rendering video and filters -->
        <canvas id="output_canvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-layer">
            <div class="top-controls">
                <button id="btn-flip" class="icon-btn" aria-label="Flip Camera">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                </button>
            </div>

            <!-- Filter Carousel -->
            <div class="filter-carousel">
                <div class="filter-option active" data-filter="none">
                    <div class="filter-icon">Ø</div>
                    <span class="filter-name">None</span>
                </div>
                <div class="filter-option" data-filter="spider_mask">
                    <img src="assets/spider_mask.jpg" alt="Mask" class="filter-icon">
                    <span class="filter-name">Spider Mask</span>
                </div>
                <div class="filter-option" data-filter="spider_eyes">
                    <img src="assets/spider_eyes.png" alt="Eyes" class="filter-icon">
                    <span class="filter-name">Spider Eyes</span>
                </div>
                <div class="filter-option" data-filter="web_face">
                    <img src="assets/web_overlay.jpg" alt="Web" class="filter-icon">
                    <span class="filter-name">Web Face</span>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <div class="mode-selector">
                    <button id="mode-photo" class="active">PHOTO</button>
                    <button id="mode-video">VIDEO</button>
                </div>
                <button id="btn-capture" class="capture-btn">
                    <div class="inner-circle"></div>
                </button>
            </div>
        </div>

        <!-- Flash Effect -->
        <div id="flash-effect"></div>

        <!-- Preview Modal -->
        <div id="preview-modal" class="hidden">
            <img id="preview-image" src="" alt="Captured Photo">
            <video id="preview-video" controls loop autoplay class="hidden"></video>
            <div class="preview-controls">
                <button id="btn-close-preview">Close</button>
                <button id="btn-save-preview">Save</button>
            </div>
        </div>
    </div>

    <!-- Load custom script -->
    <script src="script.js" type="module"></script>
</body>
</html>
